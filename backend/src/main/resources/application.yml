# Отладочные эндпоинты /api/debug/** и /api/extract/** доступны только в профиле dev:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: mortgage-reconciliation-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mortgage_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    # x-call-id и operation-id кладёт в MDC HeaderInterceptor — так запросы
    # трассируются по логам без ручного копирования идентификаторов.
    console: "%d{HH:mm:ss.SSS} %-5level [call=%X{x-call-id:-}] [op=%X{operation-id:-}] %logger{36} - %msg%n"
